<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪙 Cryptonite — Real-time Token Monitor</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      padding: 16px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .container { 
      max-width: 1400px; 
      margin: 0 auto; 
    }
    
    h1 {
      color: #38bdf8;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      font-size: clamp(1.5rem, 4vw, 2rem);
      text-align: center;
    }
    
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    
    #status {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #991b1b;
      white-space: nowrap;
    }
    
    #status.connected {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
    }
    
    #status::before {
      content: "● ";
      font-size: 12px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    
    .stat-card label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .stat-card b {
      font-size: 18px;
      color: #38bdf8;
      word-break: break-word;
    }
    
    .table-wrapper {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .table-header {
      padding: 14px 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    
    .table-header h2 {
      color: #10b981;
      font-size: 16px;
      margin: 0;
    }
    
    .table-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .table-controls input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      width: 160px;
      min-width: 0;
    }
    
    .table-controls select {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
    }
    
    .table-container {
      overflow-x: auto;
      max-height: 600px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 900px;
    }
    
    thead {
      position: sticky;
      top: 0;
      background: #0f172a;
      z-index: 10;
    }
    
    th {
      padding: 12px 14px;
      text-align: left;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #334155;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
      white-space: nowrap;
    }
    
    th:hover {
      color: #38bdf8;
    }
    
    th.sortable::after {
      content: " ⇅";
      opacity: 0.3;
    }
    
    th.sorted-asc::after {
      content: " ↑";
      opacity: 1;
      color: #10b981;
    }
    
    th.sorted-desc::after {
      content: " ↓";
      opacity: 1;
      color: #10b981;
    }
    
    tbody tr {
      border-bottom: 1px solid #334155;
      transition: background 0.2s;
    }
    
    tbody tr:hover {
      background: #0f172a;
    }
    
    tbody tr.new-row {
      animation: highlight 1s ease;
    }
    
    @keyframes highlight {
      0%, 100% { background: transparent; }
      50% { background: rgba(16, 185, 129, 0.2); }
    }
    
    td {
      padding: 12px 14px;
      color: #e2e8f0;
      white-space: nowrap;
    }
    
    /* Cell change animations */
    .cell-changed {
      animation: cellGlow 1.5s ease;
    }

    .cell-price-up {
      animation: priceUp 1.5s ease;
    }

    .cell-price-down {
      animation: priceDown 1.5s ease;
    }

    @keyframes cellGlow {
      0%, 100% { 
        background: transparent;
        box-shadow: none;
      }
      50% { 
        background: rgba(56, 189, 248, 0.3);
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      }
    }

    @keyframes priceUp {
      0%, 100% { 
        background: transparent;
        box-shadow: none;
      }
      50% { 
        background: rgba(34, 197, 94, 0.3);
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
      }
    }

    @keyframes priceDown {
      0%, 100% { 
        background: transparent;
        box-shadow: none;
      }
      50% { 
        background: rgba(239, 68, 68, 0.3);
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
      }
    }

    /* Enhanced positive/negative with pulse */
    .positive {
      color: #22c55e;
      font-weight: 600;
      animation: pulse 0.5s ease;
    }

    .negative {
      color: #ef4444;
      font-weight: 600;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .token-name {
      font-weight: 600;
      color: #38bdf8;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .token-ticker {
      font-size: 11px;
      color: #94a3b8;
      display: block;
      margin-top: 2px;
    }
    
    .source-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .source-dexscreener {
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
    }
    
    .source-geckoterminal {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }
    
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: #64748b;
    }
    
    .empty-state svg {
      width: 60px;
      height: 60px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    .empty-state p {
      font-size: 14px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      body { 
        padding: 12px; 
      }
      
      h1 { 
        font-size: 1.5rem; 
        margin-bottom: 16px; 
      }
      
      .stats { 
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      
      .stat-card {
        padding: 10px;
      }
      
      .stat-card b {
        font-size: 16px;
      }
      
      .table-header {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .table-controls {
        width: 100%;
      }
      
      .table-controls input {
        flex: 1;
        min-width: 0;
      }
      
      th, td { 
        padding: 8px 10px; 
        font-size: 12px; 
      }
      
      table {
        min-width: 800px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪙 Cryptonite — Real-time Token Monitor</h1>

    <!-- Simple status bar -->
    <div class="status-bar">
      <span id="status">Connecting...</span>
    </div>

    <div class="stats">
      <div class="stat-card">
        <label>Events</label>
        <b id="events">0</b>
      </div>
      <div class="stat-card">
        <label>Tokens</label>
        <b id="tokenCount">0</b>
      </div>
      <div class="stat-card">
        <label>Latency</label>
        <b id="latency">–</b>
      </div>
      <div class="stat-card">
        <label>Last Update</label>
        <b id="lastSeen">–</b>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="table-header">
        <h2>📊 Live Token Data</h2>
        <div class="table-controls">
          <input id="searchInput" type="text" placeholder="🔍 Search..." />
          <select id="limitSelect">
            <option value="10">Show 10</option>
            <option value="20" selected>Show 20</option>
            <option value="50">Show 50</option>
            <option value="100">Show 100</option>
          </select>
        </div>
      </div>
      
      <div class="table-container">
        <table id="tokenTable">
          <thead>
            <tr>
              <th class="sortable" data-sort="token_name">Token</th>
              <th class="sortable" data-sort="price_sol">Price (SOL)</th>
              <th class="sortable" data-sort="market_cap_sol">Market Cap</th>
              <th class="sortable" data-sort="volume_sol">Volume 24h</th>
              <th class="sortable" data-sort="liquidity_sol">Liquidity</th>
              <th class="sortable" data-sort="price_24hr_change">24h Change</th>
              <th class="sortable" data-sort="transaction_count">Txns</th>
              <th class="sortable" data-sort="protocol">Protocol</th>
              <th class="sortable" data-sort="source">Source</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="9" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 16px;">Loading live data...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Global state
    let socket = null;
    let events = 0;
    let pingInterval = null;
    let tokenData = [];
    let sortColumn = 'volume_sol';
    let sortDirection = 'desc';

    // DOM elements
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const eventsEl = $('events');
    const tokenCountEl = $('tokenCount');
    const latencyEl = $('latency');
    const lastSeenEl = $('lastSeen');
    const tableBody = $('tableBody');
    const searchInput = $('searchInput');
    const limitSelect = $('limitSelect');

    // Status management
    function setStatus(text, connected) {
      statusEl.textContent = text;
      statusEl.classList.toggle('connected', connected);
    }

    // Number formatting
    function formatNumber(num, decimals = 2) {
      if (num === 0 || num === null || num === undefined || isNaN(num)) return '0';
      const absNum = Math.abs(num);
      if (absNum >= 1e9) return (num / 1e9).toFixed(2) + 'B';
      if (absNum >= 1e6) return (num / 1e6).toFixed(2) + 'M';
      if (absNum >= 1e3) return (num / 1e3).toFixed(2) + 'K';
      return num.toFixed(decimals);
    }

    // Price change formatting
    function formatChange(change) {
      if (!change || change === 0 || isNaN(change)) return '<span>0%</span>';
      const sign = change > 0 ? '+' : '';
      const className = change > 0 ? 'positive' : 'negative';
      return `<span class="${className}">${sign}${change.toFixed(2)}%</span>`;
    }

    // Safe HTML escaping
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // Table rendering
    function renderTable() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const limit = parseInt(limitSelect.value) || 20;

      let filtered = tokenData.filter(token => 
        (token.token_name && token.token_name.toLowerCase().includes(searchTerm)) ||
        (token.token_ticker && token.token_ticker.toLowerCase().includes(searchTerm)) ||
        (token.token_address && token.token_address.toLowerCase().includes(searchTerm))
      );

      // Sort
      filtered.sort((a, b) => {
        const aVal = a[sortColumn] || 0;
        const bVal = b[sortColumn] || 0;
        
        if (typeof aVal === 'string') {
          return sortDirection === 'asc' 
            ? aVal.localeCompare(bVal)
            : bVal.localeCompare(aVal);
        }
        
        return sortDirection === 'asc' ? aVal - bVal : bVal - aVal;
      });

      // Limit results
      filtered = filtered.slice(0, limit);

      tokenCountEl.textContent = tokenData.length;

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="9" class="empty-state">
              <div>
                <p>${searchTerm ? 'No tokens match your search' : 'Waiting for data...'}</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filtered.map(token => `
        <tr>
          <td>
            <div class="token-name" title="${escapeHtml(token.token_name)}">${escapeHtml(token.token_name) || 'Unknown'}</div>
            <span class="token-ticker">${escapeHtml(token.token_ticker) || 'N/A'}</span>
          </td>
          <td>${formatNumber(token.price_sol, 8)}</td>
          <td>${formatNumber(token.market_cap_sol)}</td>
          <td>${formatNumber(token.volume_sol)}</td>
          <td>${formatNumber(token.liquidity_sol)}</td>
          <td>${formatChange(token.price_24hr_change)}</td>
          <td>${formatNumber(token.transaction_count, 0)}</td>
          <td>${escapeHtml(token.protocol) || 'Unknown'}</td>
          <td><span class="source-badge source-${escapeHtml(token.source)}">${escapeHtml(token.source)}</span></td>
        </tr>
      `).join('');

      // Update sort indicators
      document.querySelectorAll('th.sortable').forEach(th => {
        th.classList.remove('sorted-asc', 'sorted-desc');
        if (th.dataset.sort === sortColumn) {
          th.classList.add(`sorted-${sortDirection}`);
        }
      });
    }

    // WebSocket connection
    function connect() {
      const url = 'http://localhost:8081';

      socket = io(url, { 
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
        reconnectionAttempts: 5
      });

      socket.on('connect', () => {
        setStatus('Connected', true);
        console.log('✅ Connected:', socket.id);
        startLatencyProbe();
        
        // Auto-subscribe
        setTimeout(() => {
          socket.emit('subscribe');
          console.log('📡 Auto-subscribed to updates');
        }, 500);
      });

      socket.on('disconnect', (reason) => {
        setStatus('Disconnected', false);
        console.log('❌ Disconnected:', reason);
        stopLatencyProbe();
      });

      socket.on('connect_error', (err) => {
        setStatus('Connection failed', false);
        console.error('Connect error:', err.message);
        
        tableBody.innerHTML = `
          <tr>
            <td colspan="9" class="empty-state">
              <div>
                <p style="color: #ef4444;">Connection failed. Retrying...</p>
              </div>
            </td>
          </tr>
        `;
      });

      socket.on('reconnecting', (attemptNumber) => {
        setStatus(`Reconnecting (${attemptNumber})...`, false);
      });

      socket.on('initial-data', (payload) => {
        events++;
        eventsEl.textContent = events;
        tokenData = Array.isArray(payload) ? payload : [];
        lastSeenEl.textContent = new Date().toLocaleTimeString();
        renderTable();
        console.log('📦 Initial data:', tokenData.length, 'tokens');
      });

      socket.on('price-update', (payload) => {
        events++;
        eventsEl.textContent = events;
        tokenData = Array.isArray(payload) ? payload : [];
        lastSeenEl.textContent = new Date().toLocaleTimeString();
        renderTable();
        console.log('🔄 Price update:', tokenData.length, 'tokens');
      });
    }

    function startLatencyProbe() {
      stopLatencyProbe();
      pingInterval = setInterval(() => {
        if (!socket || !socket.connected) return;
        const start = Date.now();
        socket.timeout(5000).emit('ping', (err) => {
          if (!err) {
            const ms = Date.now() - start;
            latencyEl.textContent = ms + 'ms';
          }
        });
      }, 3000);
    }

    function stopLatencyProbe() {
      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }
      latencyEl.textContent = '–';
    }

    // Event listeners
    searchInput.addEventListener('input', () => {
      clearTimeout(searchInput.debounce);
      searchInput.debounce = setTimeout(renderTable, 300);
    });
    limitSelect.addEventListener('change', renderTable);

    // Table sorting
    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const column = th.dataset.sort;
        if (sortColumn === column) {
          sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          sortColumn = column;
          sortDirection = 'desc';
        }
        renderTable();
      });
    });

    // Auto-connect on page load
    window.addEventListener('load', () => {
      console.log('🚀 Auto-connecting to WebSocket...');
      setStatus('Connecting...', false);
      setTimeout(connect, 300);
    });
  </script>
</body>
</html>
