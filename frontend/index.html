<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪙 Cryptonite — Real-time Token Monitor</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      padding: 24px;
      min-height: 100vh;
    }
    
    .container { max-width: 1400px; margin: 0 auto; }
    
    h1 {
      color: #38bdf8;
      margin-bottom: 24px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      font-size: 2rem;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    
    .controls input {
      background: #0f172a;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      flex: 1;
      min-width: 200px;
    }
    
    .controls button {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: white;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .controls button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    
    .controls button.danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }
    
    .controls button.secondary {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    }
    
    #status {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #991b1b;
    }
    
    #status.connected {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
    }
    
    #status::before {
      content: "● ";
      font-size: 12px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    
    .stat-card label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .stat-card b {
      font-size: 20px;
      color: #38bdf8;
    }
    
    .table-wrapper {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .table-header {
      padding: 16px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .table-header h2 {
      color: #10b981;
      font-size: 18px;
      margin: 0;
    }
    
    .table-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .table-controls input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      width: 200px;
    }
    
    .table-controls select {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
    }
    
    .table-container {
      overflow-x: auto;
      max-height: 600px;
      overflow-y: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    
    thead {
      position: sticky;
      top: 0;
      background: #0f172a;
      z-index: 10;
    }
    
    th {
      padding: 14px 16px;
      text-align: left;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #334155;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    
    th:hover {
      color: #38bdf8;
    }
    
    th.sortable::after {
      content: " ⇅";
      opacity: 0.3;
    }
    
    th.sorted-asc::after {
      content: " ↑";
      opacity: 1;
      color: #10b981;
    }
    
    th.sorted-desc::after {
      content: " ↓";
      opacity: 1;
      color: #10b981;
    }
    
    tbody tr {
      border-bottom: 1px solid #334155;
      transition: background 0.2s;
    }
    
    tbody tr:hover {
      background: #0f172a;
    }
    
    tbody tr.new-row {
      animation: highlight 1s ease;
    }
    
    @keyframes highlight {
      0%, 100% { background: transparent; }
      50% { background: rgba(16, 185, 129, 0.2); }
    }
    
    td {
      padding: 14px 16px;
      color: #e2e8f0;
    }
    
    .positive {
      color: #22c55e;
      font-weight: 600;
    }
    
    .negative {
      color: #ef4444;
      font-weight: 600;
    }
    
    .token-name {
      font-weight: 600;
      color: #38bdf8;
    }
    
    .token-ticker {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-top: 2px;
    }
    
    .token-address {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #64748b;
    }
    
    .source-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .source-dexscreener {
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
    }
    
    .source-geckoterminal {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }
    
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: #64748b;
    }
    
    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    @media (max-width: 768px) {
      .controls { flex-direction: column; }
      .controls input, .controls button { width: 100%; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      th, td { padding: 10px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪙 Cryptonite — Real-time Token Monitor</h1>

    <div class="controls">
      <input id="server" placeholder="WebSocket URL" value="http://localhost:3000" />
      <button id="connectBtn" class="primary">🔌 Connect</button>
      <button id="disconnectBtn" class="danger">❌ Disconnect</button>
      <button id="subscribeBtn" class="secondary">📡 Subscribe</button>
      <span id="status">Disconnected</span>
    </div>

    <div class="stats">
      <div class="stat-card">
        <label>Events</label>
        <b id="events">0</b>
      </div>
      <div class="stat-card">
        <label>Tokens</label>
        <b id="tokenCount">0</b>
      </div>
      <div class="stat-card">
        <label>Latency</label>
        <b id="latency">–</b>
      </div>
      <div class="stat-card">
        <label>Last Update</label>
        <b id="lastSeen">–</b>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="table-header">
        <h2>📊 Live Token Data</h2>
        <div class="table-controls">
          <input id="searchInput" type="text" placeholder="🔍 Search tokens..." />
          <select id="limitSelect">
            <option value="10">Show 10</option>
            <option value="20" selected>Show 20</option>
            <option value="50">Show 50</option>
            <option value="100">Show 100</option>
          </select>
        </div>
      </div>
      
      <div class="table-container">
        <table id="tokenTable">
          <thead>
            <tr>
              <th class="sortable" data-sort="token_name">Token</th>
              <th class="sortable" data-sort="price_sol">Price (SOL)</th>
              <th class="sortable" data-sort="market_cap_sol">Market Cap</th>
              <th class="sortable" data-sort="volume_sol">Volume 24h</th>
              <th class="sortable" data-sort="liquidity_sol">Liquidity</th>
              <th class="sortable" data-sort="price_24hr_change">24h Change</th>
              <th class="sortable" data-sort="transaction_count">Txns</th>
              <th class="sortable" data-sort="protocol">Protocol</th>
              <th class="sortable" data-sort="source">Source</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="9" class="empty-state">
                <div>
                  <svg fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a8 8 0 100 16 8 8 0 000-16zM8 9a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1zm0 4a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/>
                  </svg>
                  <p>No data yet. Connect and subscribe to see live token updates.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    let events = 0;
    let pingInterval = null;
    let tokenData = [];
    let sortColumn = 'volume_sol';
    let sortDirection = 'desc';

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const eventsEl = $('events');
    const tokenCountEl = $('tokenCount');
    const latencyEl = $('latency');
    const lastSeenEl = $('lastSeen');
    const tableBody = $('tableBody');
    const searchInput = $('searchInput');
    const limitSelect = $('limitSelect');

    function setStatus(connected) {
      statusEl.textContent = connected ? 'Connected' : 'Disconnected';
      statusEl.classList.toggle('connected', connected);
    }

    function formatNumber(num, decimals = 2) {
      if (num === 0 || num === null || num === undefined) return '0';
      if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
      return num.toFixed(decimals);
    }

    function formatChange(change) {
      if (!change || change === 0) return '<span>0%</span>';
      const sign = change > 0 ? '+' : '';
      const className = change > 0 ? 'positive' : 'negative';
      return `<span class="${className}">${sign}${change.toFixed(2)}%</span>`;
    }

    function renderTable() {
      const searchTerm = searchInput.value.toLowerCase();
      const limit = parseInt(limitSelect.value);

      let filtered = tokenData.filter(token => 
        token.token_name?.toLowerCase().includes(searchTerm) ||
        token.token_ticker?.toLowerCase().includes(searchTerm) ||
        token.token_address?.toLowerCase().includes(searchTerm)
      );

      // Sort
      filtered.sort((a, b) => {
        const aVal = a[sortColumn] || 0;
        const bVal = b[sortColumn] || 0;
        
        if (typeof aVal === 'string') {
          return sortDirection === 'asc' 
            ? aVal.localeCompare(bVal)
            : bVal.localeCompare(aVal);
        }
        
        return sortDirection === 'asc' ? aVal - bVal : bVal - aVal;
      });

      // Limit results
      filtered = filtered.slice(0, limit);

      tokenCountEl.textContent = tokenData.length;

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="9" class="empty-state">
              <div>
                <p>${searchTerm ? 'No tokens match your search.' : 'No data available.'}</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = filtered.map(token => `
        <tr class="new-row">
          <td>
            <div class="token-name">${token.token_name || 'Unknown'}</div>
            <span class="token-ticker">${token.token_ticker || 'N/A'}</span>
          </td>
          <td>${formatNumber(token.price_sol, 8)}</td>
          <td>${formatNumber(token.market_cap_sol)}</td>
          <td>${formatNumber(token.volume_sol)}</td>
          <td>${formatNumber(token.liquidity_sol)}</td>
          <td>${formatChange(token.price_24hr_change)}</td>
          <td>${formatNumber(token.transaction_count, 0)}</td>
          <td>${token.protocol || 'Unknown'}</td>
          <td><span class="source-badge source-${token.source}">${token.source}</span></td>
        </tr>
      `).join('');

      // Update sort indicators
      document.querySelectorAll('th.sortable').forEach(th => {
        th.classList.remove('sorted-asc', 'sorted-desc');
        if (th.dataset.sort === sortColumn) {
          th.classList.add(`sorted-${sortDirection}`);
        }
      });
    }

    function connect() {
      const url = $('server').value.trim();
      if (socket) socket.disconnect();

      socket = io(url, { transports: ['websocket'] });

      socket.on('connect', () => {
        setStatus(true);
        console.log('✅ Connected:', socket.id);
        startLatencyProbe();
      });

      socket.on('disconnect', (reason) => {
        setStatus(false);
        console.log('❌ Disconnected:', reason);
        stopLatencyProbe();
      });

      socket.on('connect_error', (err) => {
        setStatus(false);
        console.error('Connect error:', err.message);
      });

      socket.on('initial-data', (payload) => {
        events++;
        eventsEl.textContent = events;
        tokenData = Array.isArray(payload) ? payload : [];
        lastSeenEl.textContent = new Date().toLocaleTimeString();
        renderTable();
        console.log('📦 Initial data:', tokenData.length, 'tokens');
      });

      socket.on('price-update', (payload) => {
        events++;
        eventsEl.textContent = events;
        tokenData = Array.isArray(payload) ? payload : [];
        lastSeenEl.textContent = new Date().toLocaleTimeString();
        renderTable();
        console.log('🔄 Price update:', tokenData.length, 'tokens');
      });
    }

    function disconnect() {
      if (socket) {
        socket.disconnect();
        socket = null;
      }
      stopLatencyProbe();
      setStatus(false);
    }

    function subscribe() {
      if (!socket || !socket.connected) {
        alert('Not connected. Please connect first.');
        return;
      }
      socket.emit('subscribe');
      console.log('📡 Subscribed to updates');
    }

    function startLatencyProbe() {
      stopLatencyProbe();
      pingInterval = setInterval(() => {
        if (!socket || !socket.connected) return;
        const start = Date.now();
        socket.timeout(5000).emit('ping', (err) => {
          if (!err) {
            const ms = Date.now() - start;
            latencyEl.textContent = ms + 'ms';
          }
        });
      }, 3000);
    }

    function stopLatencyProbe() {
      if (pingInterval) {
        clearInterval(pingInterval);
        pingInterval = null;
      }
      latencyEl.textContent = '–';
    }

    // Event listeners
    $('connectBtn').addEventListener('click', connect);
    $('disconnectBtn').addEventListener('click', disconnect);
    $('subscribeBtn').addEventListener('click', subscribe);
    searchInput.addEventListener('input', renderTable);
    limitSelect.addEventListener('change', renderTable);

    // Table sorting
    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const column = th.dataset.sort;
        if (sortColumn === column) {
          sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          sortColumn = column;
          sortDirection = 'desc';
        }
        renderTable();
      });
    });

    // Optional: Auto-connect on load
    // connect();
  </script>
</body>
</html>
