[package]
name = "ingestion-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
clickhouse = { version = "0.15.1", features = ["time"] }
rayon = "1.12.0"
redis = { version = "1.3.0", features = ["tokio-comp"] }
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.53", features = ["macros", "formatting", "parsing"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
